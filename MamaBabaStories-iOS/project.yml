name: MamaBabaStories
options:
  bundleIdPrefix: com.mamababa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: "com.mamababa.stories"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要访问麦克风来录制您的声音，用于声音克隆功能"
    INFOPLIST_KEY_UIBackgroundModes: audio
    INFOPLIST_KEY_NSAppTransportSecurity: "{NSAllowsArbitraryLoads=YES}"
    INFOPLIST_FILE: MamaBabaStories/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: "爸爸妈妈讲故事"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_ON_DEMAND_RESOURCES: NO
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
targets:
  MamaBabaStories:
    type: application
    platform: iOS
    sources:
      - path: MamaBabaStories
        excludes:
          - "**/*.md"
    resources:
      - path: MamaBabaStories/Assets.xcassets
    settings:
      base:
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要访问麦克风来录制您的声音，用于声音克隆功能"
        INFOPLIST_KEY_UIBackgroundModes: audio
  MamaBabaStoriesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MamaBabaStoriesTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MamaBabaStories.app/MamaBabaStories"
    dependencies:
      - target: MamaBabaStories
