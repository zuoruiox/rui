services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamababa-server
    restart: unless-stopped
    ports:
      - "9999:9999"
    env_file:
      - .env.production
    volumes:
      # 上传文件使用绑定挂载，方便直接访问
      - ./uploads:/app/uploads
      # 数据库使用绑定挂载，数据保存在宿主机 ./data 目录
      # 更新镜像/重建容器时数据不会丢失
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
