<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爸爸妈妈讲故事</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Login/Register Page -->
<div class="auth-page" id="authPage">
  <div class="auth-card">
    <div class="auth-logo">📖 爸爸妈妈讲故事</div>
    <div class="auth-subtitle">用AI为孩子创造专属故事</div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="请输入邮箱" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
      </div>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">登 录</button>
    </form>
    <form id="registerForm" style="display:none;">
      <div class="form-group">
        <label class="form-label">昵称</label>
        <input type="text" class="form-input" id="regNickname" placeholder="请输入昵称" required>
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" id="regEmail" placeholder="请输入邮箱" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="regPassword" placeholder="至少6位" required minlength="6">
      </div>
      <div class="form-error" id="registerError"></div>
      <button type="submit" class="btn btn-primary btn-lg" id="registerBtn">注 册</button>
    </form>
    <div class="auth-hint">
      管理员：admin@mamababa.com / admin123456
    </div>
  </div>
</div>

<!-- App Layout -->
<div class="app-layout" id="appLayout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" id="sidebarLogo">📖 讲故事</div>
    <nav class="sidebar-menu" id="sidebarMenu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="header-title" id="headerTitle">首页</div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">U</div>
          <span class="user-name" id="userName">用户</span>
          <span class="role-badge" id="userRoleBadge">用户</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">退出</button>
      </div>
    </header>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<!-- Generic Modal -->
<div class="modal-overlay" id="genericModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">标题</div>
      <button class="modal-close" onclick="closeModal('genericModal')">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn btn-secondary" onclick="closeModal('genericModal')">取消</button>
      <button class="btn btn-primary" id="modalOkBtn">确定</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="modal-overlay" id="confirmDialog">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title" id="confirmTitle">确认操作</div>
    </div>
    <div class="modal-body">
      <div id="confirmMessage" style="font-size:14px;line-height:1.6;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
      <button class="btn btn-danger" id="confirmOkBtn">确认</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
